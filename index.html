<!DOCTYPE html>
<html>
  <head>
    <title>Kalkulator Alokasi Dana</title>
    
  </head>
  <body>
    <h1>Kalkulator Alokasi Dana</h1>
    <h2>By Fahri</h2>
    <p>Masukkan jumlah uangmu:</p>
    <input type="number" id="uang" placeholder="Contoh: 300000">

    <p>Atur persentase alokasi kalian:</p>
    <div class="baris"><span>Tabungan</span><span class="nilai"><input type="number" id="p-tabungan" value="30" min="0" max="100">%</span></div>
    <div class="baris"><span>Dana darurat</span><span class="nilai"><input type="number" id="p-darurat" value="10" min="0" max="100">%</span></div>
    <div class="baris"><span>Sedekah</span><span class="nilai"><input type="number" id="p-sedekah" value="10" min="0" max="100">%</span></div>
    <div class="baris"><span>Kebutuhan</span><span class="nilai"><input type="number" id="p-kebutuhan" value="30" min="0" max="100">%</span></div>
    <div class="baris"><span>Foya-foya</span><span class="nilai"><input type="number" id="p-lentur" value="20" min="0" max="100">%</span></div>

    <p id="total"></p>

    <button id="tombol" onclick="hitung()">Hitung</button>
    <p id="hasil"></p>

    <style>


* {
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f2f7f2;
  color: #111;
  margin: 0;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;

  text-align: center;
  padding: 32px 20px 36px;
}

/* Judul */
h1 {
  color: #2e7d32;
  font-size: clamp(28px, 6.5vw, 36px);
  line-height: 1.25;
  margin: 0 0 16px;
}

h2 {
  color: #2e7d32;
  font-size: 17px;
  margin: 0 0 30px;
}

p {
  font-size: 19px;
  line-height: 1.5;
  margin: 16px 0;
}

/* Semua input */
input {
  font-family: inherit;
  font-size: 18px;
  padding: 11px 12px;
  min-height: 48px;

  border: 2px solid #2e7d32;
  border-radius: 9px;
  background-color: #fff;
  color: #111;
}

/* Input jumlah uang */
#uang {
  width: 100%;
  max-width: 460px;
  margin-bottom: 8px;
}

/* Baris kategori alokasi */
.baris {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;

  width: 100%;
  margin: 7px 0;
  font-size: 17px;
  text-align: left;
}

.baris input {
  width: 88px;
  min-height: 48px;
  flex-shrink: 0;
  text-align: center;
  padding: 8px;
  font-size: 18px;
}

/* Angka persentase dan tanda % */
.nilai {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

/* Total persentase */
.pas {
  color: #2e7d32;
  font-weight: bold;
}

.salah {
  color: #c62828;
  font-weight: bold;
}

/* Tombol hitung */
button {
  width: 100%;
  max-width: 460px;
  min-height: 52px;

  font-family: inherit;
  font-size: 18px;
  font-weight: bold;
  padding: 12px;

  margin-top: 20px;
  background-color: #2e7d32;
  color: #fff;
  border: none;
  border-radius: 9px;
  cursor: pointer;
}

button:disabled {
  background-color: #9e9e9e;
  cursor: not-allowed;
}

/* Tampilan iPhone */
@@media (max-width: 600px) {
  body {
    padding: 30px 16px;
  }

  h1 {
    font-size: 30px;
  }

  p {
    font-size: 20px;
  }

  #uang,
  .baris,
  button {
    width: 100%;
    max-width: 500px;
  }

  .baris {
    font-size: 18px;
    margin: 10px 0;
  }

  .baris input {
    width: 92px;
    min-height: 52px;
    font-size: 19px;
  }

  button {
    min-height: 54px;
    font-size: 19px;
  }
}
  }
}

/* Tampilan laptop */
@media (min-width: 601px) {
  body {
    padding-top: 44px;
  }

  #uang,
  .baris,
  button {
    max-width: 460px;
  }
}
      

    </style>

    <script>
      var pos = [
  { nama: "Tabungan", id: "p-tabungan" },
  { nama: "Dana darurat", id: "p-darurat" },
  { nama: "Sedekah", id: "p-sedekah" },
  { nama: "Kebutuhan", id: "p-kebutuhan" },
  { nama: "Foya-foya", id: "p-lentur" }
];

function cekTotal() {
  var total = 0;
  var adaNegatif = false;

  for (var i = 0; i < pos.length; i++) {
    var nilai = Number(document.getElementById(pos[i].id).value);
    if (nilai < 0) {
      adaNegatif = true;
    }
    total += nilai;
  }

  total = Math.round(total * 100) / 100;

  var elTotal = document.getElementById("total");
  var tombol = document.getElementById("tombol");
  elTotal.innerHTML = "Total: " + total + "%";

  if (total === 100 && !adaNegatif) {
    elTotal.className = "pas";
    tombol.disabled = false;
  } else {
    elTotal.className = "salah";
    tombol.disabled = true;
    if (total > 100) {
      elTotal.innerHTML += " (kelebihan " + (total - 100) + "%)";
    } else if (total < 100 && !adaNegatif) {
      elTotal.innerHTML += " (kurang " + (100 - total) + "%)";
    }
  }
}

for (var i = 0; i < pos.length; i++) {
  document.getElementById(pos[i].id).addEventListener("input", cekTotal);
}

cekTotal();

function hitung() {
  var uang = Number(document.getElementById("uang").value);
  var hasil = document.getElementById("hasil");

  if (uang <= 0) {
    hasil.innerHTML = "Isi dulu jumlah uangmu dengan angka lebih dari 0.";
    return;
  }

  var teks = "";

  for (var i = 0; i < pos.length; i++) {
    var persen = Number(document.getElementById(pos[i].id).value);
    var jumlah = uang * persen / 100;
    teks += pos[i].nama + " (" + persen + "%): Rp" +
      jumlah.toLocaleString("id-ID") + "<br>";
  }

  hasil.innerHTML = teks;
}
      
    </script>
    
  </body>
</html>
