<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>glow up ✦ habit tracker</title>
<meta name="description" content="Habit tracker aesthetic buat remaja: ibadah, olahraga, belajar, baca buku, dan hobi.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
:root {
  --bg: #fbf7f2;
  --ink: #1f1b2e;
  --muted: #8a8499;
  --line: #ece5dc;
  --card: #ffffffcc;
  --lilac: #c9b8ff;
  --mint: #b6ecd4;
  --peach: #ffc9b0;
  --butter: #ffe9a3;
  --sky: #b8dcff;
  --accent: #7b5cff;
}
html { -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Outfit", system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
  overflow-x: hidden;
}
/* soft blobs + grain */
body::before, body::after {
  content: "";
  position: fixed;
  z-index: -2;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .55;
}
body::before { width: 420px; height: 420px; background: var(--lilac); top: -140px; right: -120px; animation: float 14s ease-in-out infinite; }
body::after { width: 360px; height: 360px; background: var(--mint); bottom: -120px; left: -120px; animation: float 18s ease-in-out infinite reverse; }
.grain {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .07;
  background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@keyframes float { 50% { transform: translate(30px, 40px) scale(1.08); } }

.app { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }

/* header */
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.hello small { display: block; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
h1 {
  font-family: "Bricolage Grotesque", sans-serif;
  font-weight: 800;
  font-size: clamp(34px, 9vw, 46px);
  line-height: .95;
  letter-spacing: -2px;
  margin: 0;
}
h1 em { font-style: normal; background: linear-gradient(100deg, var(--accent), #ff7eb6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.streak-pill {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 10px 14px;
  border-radius: 999px;
  background: var(--ink); color: #fff;
  font-weight: 600; font-size: 15px;
  box-shadow: 0 8px 20px -8px #1f1b2e88;
}
.streak-pill .fire { display: inline-block; animation: flick 1.6s ease-in-out infinite; }
@keyframes flick { 50% { transform: scale(1.18) rotate(-6deg); } }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 18px; }
.day {
  border: 1.5px solid var(--line);
  background: var(--card);
  backdrop-filter: blur(8px);
  border-radius: 18px;
  padding: 9px 0 8px;
  text-align: center;
  cursor: pointer;
  font: inherit; color: inherit;
  transition: transform .2s, background .2s, border-color .2s;
}
.day:hover { transform: translateY(-2px); }
.day small { display: block; font-size: 11px; color: var(--muted); text-transform: lowercase; }
.day b { display: block; font-family: "Bricolage Grotesque"; font-size: 18px; margin: 2px 0 4px; }
.dots { display: flex; justify-content: center; gap: 2px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.day.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.day.active small { color: #ffffffaa; }
.day.active .dots i { background: #ffffff33; }
.day.active .dots i.on { background: var(--butter); }
.day.future { opacity: .35; cursor: not-allowed; }
.day.future:hover { transform: none; }

/* progress card */
.progress {
  position: relative;
  display: flex; align-items: center; gap: 18px;
  padding: 20px;
  border-radius: 28px;
  background: linear-gradient(135deg, #fff 0%, #f4efff 100%);
  border: 1.5px solid var(--line);
  margin-bottom: 18px;
  overflow: hidden;
}
.ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
.ring .track { stroke: #ebe4ff; }
.ring .bar { stroke: url(#grad); transition: stroke-dashoffset .7s cubic-bezier(.3,1.4,.5,1); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 24px; }
.progress h2 { font-family: "Bricolage Grotesque"; font-size: 21px; margin: 0 0 4px; letter-spacing: -.5px; }
.progress p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.sparkle { position: absolute; right: 16px; top: 12px; font-size: 20px; opacity: .7; animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* habits */
.section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 4px 10px; }
.section-title h3 { margin: 0; font-family: "Bricolage Grotesque"; font-size: 18px; }
.section-title span { color: var(--muted); font-size: 13px; }
.habits { display: grid; gap: 10px; }
.habit {
  --c: var(--lilac);
  display: flex; align-items: center; gap: 14px;
  width: 100%;
  padding: 14px 16px 14px 14px;
  border: 1.5px solid var(--line);
  border-radius: 24px;
  background: var(--card);
  backdrop-filter: blur(8px);
  font: inherit; color: inherit; text-align: left;
  cursor: pointer;
  transition: transform .18s, border-color .2s, background .25s;
  animation: rise .5s both;
}
.habit:hover { transform: translateY(-2px); border-color: var(--c); }
.habit:active { transform: scale(.98); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.emoji {
  width: 52px; height: 52px; flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 18px;
  background: var(--c);
  font-size: 26px;
  transition: transform .3s cubic-bezier(.3,1.8,.5,1);
}
.info { flex: 1; min-width: 0; }
.info b { display: block; font-weight: 600; font-size: 16px; }
.info small { color: var(--muted); font-size: 13px; }
.meta { display: flex; align-items: center; gap: 10px; }
.mini-streak { font-size: 12px; color: var(--muted); white-space: nowrap; }
.check {
  width: 30px; height: 30px; flex-shrink: 0;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: grid; place-items: center;
  transition: background .25s, border-color .25s, transform .3s;
}
.check svg { width: 16px; opacity: 0; transform: scale(.4); transition: .3s cubic-bezier(.3,1.8,.5,1); }
.habit.done { background: color-mix(in srgb, var(--c) 28%, #fff); border-color: var(--c); }
.habit.done .info b { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: color-mix(in srgb, var(--ink) 35%, transparent); }
.habit.done .check { background: var(--ink); border-color: var(--ink); }
.habit.done .check svg { opacity: 1; transform: scale(1); }
.habit.done .emoji { transform: rotate(-8deg) scale(1.06); }
.habit.pop .emoji { animation: pop .45s; }
@keyframes pop { 40% { transform: scale(1.3) rotate(10deg); } }

/* heatmap */
.heat-card { margin-top: 22px; padding: 18px; border-radius: 28px; background: var(--card); border: 1.5px solid var(--line); backdrop-filter: blur(8px); }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; }
.heat i { aspect-ratio: 1; border-radius: 6px; background: #f0ebe4; }
.heat i[data-l="1"] { background: #e6ddff; }
.heat i[data-l="2"] { background: #cbb9ff; }
.heat i[data-l="3"] { background: #a68bff; }
.heat i[data-l="4"] { background: #7b5cff; }
.heat i[data-l="5"] { background: #1f1b2e; }
.legend { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 10px; font-size: 11px; color: var(--muted); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.quote { margin: 22px 6px 0; text-align: center; color: var(--muted); font-size: 14px; }
.quote b { color: var(--ink); font-weight: 500; }
.sync { text-align: center; font-size: 11px; color: var(--muted); margin-top: 14px; }

/* toast + confetti */
.toast {
  position: fixed; left: 50%; bottom: 26px;
  transform: translate(-50%, 140%);
  padding: 12px 18px; border-radius: 999px;
  background: var(--ink); color: #fff; font-weight: 500; font-size: 14px;
  box-shadow: 0 14px 30px -10px #1f1b2e99;
  transition: transform .45s cubic-bezier(.3,1.5,.5,1);
  white-space: nowrap; z-index: 20;
}
.toast.show { transform: translate(-50%, 0); }
.confetti { position: fixed; top: -20px; font-size: 22px; pointer-events: none; z-index: 30; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="grain"></div>
<main class="app">
  <header>
    <div class="hello">
      <small id="greet">hai bestie 👋</small>
      <h1>glow up<br><em>era</em> ✦</h1>
    </div>
    <div class="streak-pill" title="Streak hari berturut-turut semua habit selesai"><span class="fire">🔥</span><span id="streak">0</span> hari</div>
  </header>

  <nav class="week" id="week" aria-label="Pilih hari"></nav>

  <section class="progress">
    <div class="ring">
      <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true">
        <defs><linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#ff7eb6"/></linearGradient></defs>
        <circle class="track" cx="46" cy="46" r="38"/>
        <circle class="bar" id="bar" cx="46" cy="46" r="38" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
      </svg>
      <span id="pct">0%</span>
    </div>
    <div>
      <h2 id="moodTitle">yuk mulai ✨</h2>
      <p id="moodText">Satu langkah kecil hari ini = kamu yang lebih keren besok.</p>
    </div>
    <span class="sparkle">✦</span>
  </section>

  <div class="section-title"><h3 id="dayLabel">hari ini</h3><span id="count">0/5 done</span></div>
  <section class="habits" id="habits"></section>

  <section class="heat-card">
    <div class="section-title" style="margin-top:0"><h3>28 hari terakhir 📆</h3><span id="total">0 checklist</span></div>
    <div class="heat" id="heat"></div>
    <div class="legend">dikit <i style="background:#f0ebe4"></i><i style="background:#cbb9ff"></i><i style="background:#7b5cff"></i><i style="background:#1f1b2e"></i> full</div>
  </section>

  <p class="quote" id="quote"></p>
  <p class="sync" id="sync">☁️ menyambungkan…</p>
</main>
<div class="toast" id="toast"></div>

<script>
const HABITS = [
  { key: "ibadah",   name: "Ibadah",        desc: "sholat, ngaji, doa 🤲",      emoji: "🕌", color: "var(--mint)" },
  { key: "olahraga", name: "Olahraga",      desc: "gerak min. 20 menit 💪",     emoji: "🏃", color: "var(--peach)" },
  { key: "belajar",  name: "Belajar",       desc: "fokus 1 sesi pomodoro 🧠",   emoji: "📚", color: "var(--sky)" },
  { key: "baca",     name: "Baca Buku",     desc: "10 halaman aja cukup 🤓",    emoji: "📖", color: "var(--butter)" },
  { key: "hobi",     name: "Ngelakuin Hobi",desc: "me time, healing dulu 🎧",   emoji: "🎨", color: "var(--lilac)" },
];
const DAYS = ["min", "sen", "sel", "rab", "kam", "jum", "sab"];
const QUOTES = [
  "<b>small steps, big glow up.</b> konsisten > sempurna 💫",
  "<b>progress, not perfection.</b> santai tapi pasti 🐢",
  "<b>main character energy</b> dimulai dari kebiasaan kecil 🎬",
  "<b>you vs you.</b> jangan bandingin sama timeline orang 🫶",
  "<b>it's giving discipline.</b> bangga sama diri sendiri ya 🌷",
];

const $ = (id) => document.getElementById(id);
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = new Date(); today.setHours(0, 0, 0, 0);
const TODAY = iso(today);

let device = localStorage.getItem("habit-device");
if (!device) { device = crypto.randomUUID(); localStorage.setItem("habit-device", device); }

// state: { "2026-10-27": Set(["ibadah", ...]) }
let checks = {};
try {
  const cached = JSON.parse(localStorage.getItem("habit-cache") || "{}");
  for (const k in cached) checks[k] = new Set(cached[k]);
} catch {}
let selected = TODAY;

const saveCache = () => {
  const out = {};
  for (const k in checks) if (checks[k].size) out[k] = [...checks[k]];
  localStorage.setItem("habit-cache", JSON.stringify(out));
};
const doneOn = (day) => checks[day]?.size || 0;

function habitStreak(key) {
  let n = 0, d = new Date(today);
  if (!checks[iso(d)]?.has(key)) d = addDays(d, -1);
  while (checks[iso(d)]?.has(key)) { n++; d = addDays(d, -1); }
  return n;
}
function fullStreak() {
  let n = 0, d = new Date(today);
  if (doneOn(iso(d)) < HABITS.length) d = addDays(d, -1);
  while (doneOn(iso(d)) >= HABITS.length) { n++; d = addDays(d, -1); }
  return n;
}

function renderWeek() {
  const start = addDays(today, -today.getDay()); // minggu ini (Min–Sab)
  $("week").innerHTML = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(start, i), k = iso(d), future = d > today;
    const dots = HABITS.map((h) => `<i class="${checks[k]?.has(h.key) ? "on" : ""}"></i>`).join("");
    return `<button class="day ${k === selected ? "active" : ""} ${future ? "future" : ""}" data-day="${k}" ${future ? "disabled" : ""}>
      <small>${DAYS[d.getDay()]}</small><b>${d.getDate()}</b><span class="dots">${dots}</span></button>`;
  }).join("");
}

function renderHabits() {
  const set = checks[selected] || new Set();
  $("habits").innerHTML = HABITS.map((h, i) => {
    const s = habitStreak(h.key);
    return `<button class="habit ${set.has(h.key) ? "done" : ""}" data-key="${h.key}" style="--c:${h.color};animation-delay:${i * 60}ms" aria-pressed="${set.has(h.key)}">
      <span class="emoji">${h.emoji}</span>
      <span class="info"><b>${h.name}</b><small>${h.desc}</small></span>
      <span class="meta">${s ? `<span class="mini-streak">🔥 ${s}</span>` : ""}
        <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      </span></button>`;
  }).join("");
}

function renderProgress() {
  const n = doneOn(selected), pct = Math.round((n / HABITS.length) * 100);
  $("bar").style.strokeDashoffset = 238.76 * (1 - n / HABITS.length);
  $("pct").textContent = pct + "%";
  $("count").textContent = `${n}/${HABITS.length} done`;
  const moods = [
    ["yuk mulai ✨", "Satu langkah kecil hari ini = kamu yang lebih keren besok."],
    ["nice start 🌱", "Udah mulai, itu yang paling susah. Lanjut!"],
    ["on track 🚀", "Pelan-pelan tapi pasti, kamu keren."],
    ["lagi on fire 🔥", "Lebih dari setengah jalan, gaskeun!"],
    ["dikit lagi!! 🤏", "Tinggal satu lagi, jangan kasih kendor."],
    ["slay queen/king 👑", "Semua habit selesai. Proud of you!"],
  ];
  [$("moodTitle").textContent, $("moodText").textContent] = moods[n];
  $("dayLabel").textContent = selected === TODAY ? "hari ini" :
    new Date(selected + "T00:00").toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "short" }).toLowerCase();
  $("streak").textContent = fullStreak();
}

function renderHeat() {
  let total = 0;
  $("heat").innerHTML = Array.from({ length: 28 }, (_, i) => {
    const k = iso(addDays(today, i - 27)), n = doneOn(k);
    total += n;
    return `<i data-l="${n}" title="${k}: ${n}/${HABITS.length}"></i>`;
  }).join("");
  $("total").textContent = `${total} checklist`;
}

const render = () => { renderWeek(); renderHabits(); renderProgress(); renderHeat(); };

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2200);
}
function confetti() {
  const bits = ["✨", "🎉", "💜", "⭐", "🌸", "🫶"];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 1.8 + Math.random() * 1.6 + "s";
    s.style.animationDelay = Math.random() * .4 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
}

async function toggle(key) {
  const set = (checks[selected] ||= new Set());
  const done = !set.has(key);
  done ? set.add(key) : set.delete(key);
  saveCache();
  render();
  const el = document.querySelector(`.habit[data-key="${key}"]`);
  if (done) {
    el.classList.add("pop");
    if (set.size === HABITS.length) { confetti(); toast("semua habit done! kamu keren banget 👑"); }
    else toast(["mantap! ✅", "gacor 🔥", "nice 💅", "keep going 🚀"][Math.floor(Math.random() * 4)]);
  }
  try {
    const res = await fetch("/api/habits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, habit: key, day: selected, done }),
    });
    if (!res.ok) throw new Error();
    $("sync").textContent = "☁️ tersimpan otomatis";
  } catch {
    $("sync").textContent = "📴 offline — tersimpan di perangkat ini";
  }
}

$("habits").addEventListener("click", (e) => {
  const b = e.target.closest(".habit");
  if (b) toggle(b.dataset.key);
});
$("week").addEventListener("click", (e) => {
  const b = e.target.closest(".day");
  if (b && !b.disabled) { selected = b.dataset.day; render(); }
});

async function load() {
  try {
    const from = iso(addDays(today, -90));
    const res = await fetch(`/api/habits?device=${device}&from=${from}`);
    if (!res.ok) throw new Error();
    const rows = await res.json();
    const fresh = {};
    for (const r of rows) (fresh[r.day] ||= new Set()).add(r.habit);
    // keep cached days older than the fetched window
    for (const k in checks) if (k < from) fresh[k] = checks[k];
    checks = fresh;
    saveCache();
    $("sync").textContent = "☁️ tersimpan otomatis";
  } catch {
    $("sync").textContent = "📴 offline — tersimpan di perangkat ini";
  }
  render();
}

const h = new Date().getHours();
$("greet").textContent = h < 11 ? "pagi bestie ☀️" : h < 15 ? "siang bestie 🌤️" : h < 19 ? "sore bestie 🌇" : "malam bestie 🌙";
$("quote").innerHTML = QUOTES[today.getDate() % QUOTES.length];
render();
load();
</script>
</body>
</html>
